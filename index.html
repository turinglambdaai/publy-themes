<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publy Theme Gallery</title>
<meta name="description" content="Browse Publy themes with real rendered previews — article themes for WeChat HTML typesetting, card themes for xiaolvshu 3:4 decks.">
<style>
    :root { --bg:#111; --card:#1c1c1c; --text:#eee; --muted:#999; --accent:#07C160; --border:#2a2a2a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; padding: 48px 24px 80px; }
    .container { max-width: 1080px; margin: 0 auto; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .lead { color: var(--muted); margin-bottom: 40px; line-height: 1.6; }
    .lead code { color: var(--accent); }
    section { margin-bottom: 48px; }
    h2 { font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: transform .15s, border-color .15s; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .card img { width: 100%; height: 340px; object-fit: cover; object-position: top; display: block; }
    .card.card-kind img { height: 300px; object-fit: contain; background: #fff; padding: 8px; }
    .card-body { padding: 16px 18px 18px; }
    .card-name { font-size: 16px; font-weight: 700; }
    .card-kind-tag { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 1px 7px; margin-left: 8px; vertical-align: 2px; }
    .card-desc { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
    footer { margin-top: 60px; text-align: center; color: var(--muted); font-size: 13px; }
    footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
    <h1>Publy Theme Gallery</h1>
    <p class="lead">每个主题的预览都是<strong>真实渲染产物</strong>：文章主题渲染同一篇样例文章，卡片主题渲染同一份分节小绿书——所见即发布。本地试用：<code>publy theme preview &lt;name&gt;</code>。</p>

    <section>
        <h2>Article themes · 公众号文章排版</h2>
        <div class="grid" id="article-grid"></div>
    </section>

    <section>
        <h2>Card themes · 小绿书卡片</h2>
        <div class="grid" id="card-grid"></div>
    </section>

    <footer>
        Powered by <a href="https://github.com/turinglambdaai/publy">Publy</a> ·
        Submit a theme via <a href="https://github.com/turinglambdaai/publy-themes">pull request</a>
    </footer>
</div>
<script>
const reg = {
  "version": 1,
  "description": "Publy theme registry — curated list of article and card themes. Built-ins ship with @publy/core; external themes are npm packages installed with `publy theme add`.",
  "themes": [
    {
      "id": "claude",
      "kind": "article",
      "source": "builtin",
      "description": "Warm oat Claude-style theme (default)",
      "preview": "previews/claude.png"
    },
    {
      "id": "naive",
      "kind": "card",
      "source": "builtin",
      "description": "Clean white ink card theme (default)",
      "preview": "previews/card-naive.png"
    },
    {
      "id": "claude",
      "kind": "card",
      "source": "builtin",
      "description": "Warm oat card theme matching the claude article theme",
      "preview": "previews/card-claude.png"
    },
    {
      "id": "medium",
      "kind": "article",
      "source": "builtin",
      "description": "Medium-style clean blog typesetting",
      "preview": "previews/medium.png"
    }
  ]
}
;
{
void reg;
    for (const t of reg.themes) {
        const el = document.createElement('div');
        el.className = 'card' + (t.kind === 'card' ? ' card-kind' : '');
        el.innerHTML = `<img src="${t.preview}" alt="${t.id}">
            <div class="card-body"><span class="card-name">${t.id}</span><span class="card-kind-tag">${t.kind}</span>
            <p class="card-desc">${t.description || ''}</p></div>`;
        document.getElementById(t.kind === 'card' ? 'card-grid' : 'article-grid').appendChild(el);
    }
});
</script>
</body>
</html>
